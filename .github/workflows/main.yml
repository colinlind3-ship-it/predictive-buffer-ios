
name: Build Geode Mod (iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build iOS mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS
          bindings: vwtfafa/bindings
          bindings-ref: fix/2.2081-depends

      - name: Upload iOS mod
        uses: actions/upload-artifact@v4
        with:
          name: predictive-buffer-ios
          path: output/*.geode
          if-no-files-found: error
